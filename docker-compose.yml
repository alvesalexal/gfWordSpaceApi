services:
  db:
    image: mysql:8.0
    container_name: wordspace-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: pass
      MYSQL_DATABASE: debq
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wordspace-api
    restart: unless-stopped
    ports:
      - "3333:3333"
    environment:
      DATABASE_URL: "mysql://root:pass@db:3306/debq"
      PORT: "3333"
      JWT_SECRET: "wordspace-secret-key"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql-data:

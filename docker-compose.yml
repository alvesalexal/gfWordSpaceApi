services:
  db:
    image: postgres:16-alpine
    container_name: wordspace-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: debq
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wordspace-api
    restart: unless-stopped
    ports:
      - "3333:3333"
    environment:
      DATABASE_URL: "postgresql://postgres:pass@db:5432/debq"
      PORT: "3333"
      JWT_SECRET: "wordspace-secret-key"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
